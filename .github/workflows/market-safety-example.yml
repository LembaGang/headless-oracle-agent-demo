# Example: Using the Headless Oracle Market Safety Check Action
#
# Add this to your trading or financial workflow to verify market state
# before deploying code or executing automated operations.
#
# The action fails on HALTED or UNKNOWN (fail-closed).
# CLOSED passes by default (set allow_closed: false to also fail on CLOSED).

name: Market Safety Gate (Example)

on:
  workflow_dispatch:
    inputs:
      tamper:
        description: 'Change one signed field of the receipt before verifying it (proves the verify step fails a bad signature)'
        type: boolean
        default: false
  schedule:
    # GitHub cron runs in UTC and does not follow daylight saving time.
    # 14:30 UTC is the NYSE open only in winter (EST, UTC-5); in summer (EDT,
    # UTC-4) the open is 13:30 UTC, so this run lands an hour after it.
    - cron: '30 14 * * 1-5'

jobs:
  check-market:
    runs-on: ubuntu-latest
    name: Verify NYSE is open before trading operations
    outputs:
      # The status of the receipt whose signature was verified, not the raw action output.
      status: ${{ steps.verify.outputs.status }}

    steps:
      # allow_closed: true so a CLOSED market is a held trade, not a red run.
      # HALTED, UNKNOWN and an unreachable oracle still fail this step (fail-closed).
      - name: Check NYSE market status
        id: oracle
        uses: LembaGang/headless-oracle-agent-demo@v1
        with:
          mic: XNYS
          allow_closed: true
          api_key: ${{ secrets.HEADLESS_ORACLE_API_KEY }}   # optional

      # Outputs are available for downstream steps
      - name: Show oracle result
        run: |
          echo "Market status : ${{ steps.oracle.outputs.status }}"
          echo "Safe to execute: ${{ steps.oracle.outputs.safe_to_execute }}"
          echo "Receipt ID    : ${{ steps.oracle.outputs.receipt_id }}"
          echo "Expires at    : ${{ steps.oracle.outputs.expires_at }}"

      # The action's outputs carry the signature but not the signed fields, so this
      # step fetches the receipt from the same endpoint the action uses and checks
      # its Ed25519 signature against the published keys before anything trusts it.
      # A bad or missing signature, an unknown key or an expired receipt fails the job.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify receipt signature
        id: verify
        env:
          HEADLESS_ORACLE_API_KEY: ${{ secrets.HEADLESS_ORACLE_API_KEY }}
          TAMPER: ${{ inputs.tamper == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          npm init -y > /dev/null
          npm install --no-audit --no-fund @headlessoracle/verify@1.1.0 > /dev/null
          cat > verify.mjs <<'JS'
          import { appendFileSync } from 'node:fs';
          import { EOL } from 'node:os';
          import { verify } from '@headlessoracle/verify';

          const key = process.env.HEADLESS_ORACLE_API_KEY || '';
          const url = key
            ? 'https://api.headlessoracle.com/v5/status?mic=XNYS'
            : 'https://api.headlessoracle.com/v5/demo?mic=XNYS';
          const res = await fetch(url, key ? { headers: { 'X-Oracle-Key': key } } : {});
          if (!res.ok) { console.log(`::error::Oracle returned HTTP ${res.status} (fail-closed)`); process.exit(1); }
          const wrapper = await res.json();
          const receipt = { ...(wrapper.receipt ?? wrapper) };

          if (process.env.TAMPER === 'true') {
            receipt.status = receipt.status === 'OPEN' ? 'CLOSED' : 'OPEN';
            console.log(`tamper=true: status field changed to ${receipt.status} after signing`);
          }

          const { valid, reason } = await verify(receipt, { keysUrl: 'https://api.headlessoracle.com/v5/keys' });
          if (!valid) {
            console.log(`::error::Receipt ${receipt.receipt_id ?? '(no id)'} failed verification: ${reason} (fail-closed)`);
            process.exit(1);
          }
          console.log(`signature verified: receipt ${receipt.receipt_id}, ${receipt.mic} ${receipt.status}, key ${receipt.public_key_id}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `status=${receipt.status}${EOL}`);
          JS
          node verify.mjs

      # Decides on the verified receipt: OPEN goes on to trade, CLOSED holds and
      # ends green; any other status fails.
      - name: Gate decision
        env:
          STATUS: ${{ steps.verify.outputs.status }}
        run: |
          case "$STATUS" in
            OPEN)   echo "NYSE OPEN: trading may proceed" >> "$GITHUB_STEP_SUMMARY" ;;
            CLOSED) echo "NYSE CLOSED: the gate held trading" >> "$GITHUB_STEP_SUMMARY" ;;
            *)      echo "::error::Unexpected market status '$STATUS' (fail-closed)"; exit 1 ;;
          esac

  # This job only runs if the market check passes and NYSE is OPEN
  execute-trading-operations:
    runs-on: ubuntu-latest
    needs: check-market   # gates on the oracle check
    if: needs.check-market.outputs.status == 'OPEN'
    name: Execute trading operations

    steps:
      - uses: actions/checkout@v4

      - name: Run trading strategy
        run: |
          echo "Market is verified OPEN — executing strategy…"
          # python src/strategy.py
          # or your trading code here

  # Example: check multiple exchanges for a global strategy.
  #
  # These three markets are never simultaneously open (NYSE is EST, LSE is GMT,
  # Tokyo is JST), so the correct pattern is fail-closed per-market: check each
  # exchange independently, then execute only for the markets that are currently
  # OPEN. HALTED or UNKNOWN still fail the step — that's the safety guarantee.
  check-global-markets:
    runs-on: ubuntu-latest
    name: Verify all exchanges for global strategy

    steps:
      # allow_closed defaults to true — CLOSED does not fail the step.
      # HALTED and UNKNOWN still cause the action to exit non-zero (fail-closed).
      - name: Check NYSE (XNYS)
        id: nyse
        uses: LembaGang/headless-oracle-agent-demo@v1
        with:
          mic: XNYS

      - name: Check LSE (XLON)
        id: lse
        uses: LembaGang/headless-oracle-agent-demo@v1
        with:
          mic: XLON

      - name: Check Tokyo (XJPX)
        id: tse
        uses: LembaGang/headless-oracle-agent-demo@v1
        with:
          mic: XJPX

      # Execute strategy only for the markets that are currently OPEN.
      # Markets that are CLOSED are skipped — not an error, just outside hours.
      # Any HALTED or UNKNOWN result fails the oracle step above before reaching here.
      - name: Execute NYSE strategy (if OPEN)
        if: steps.nyse.outputs.status == 'OPEN'
        run: |
          echo "NYSE (XNYS) is OPEN — executing US equity strategy…"
          # python src/strategy_us.py

      - name: Execute LSE strategy (if OPEN)
        if: steps.lse.outputs.status == 'OPEN'
        run: |
          echo "LSE (XLON) is OPEN — executing UK equity strategy…"
          # python src/strategy_uk.py

      - name: Execute Tokyo strategy (if OPEN)
        if: steps.tse.outputs.status == 'OPEN'
        run: |
          echo "Tokyo (XJPX) is OPEN — executing JP equity strategy…"
          # python src/strategy_jp.py

      - name: Report which markets were active
        run: |
          echo "NYSE  (XNYS): ${{ steps.nyse.outputs.status }}"
          echo "LSE   (XLON): ${{ steps.lse.outputs.status }}"
          echo "Tokyo (XJPX): ${{ steps.tse.outputs.status }}"

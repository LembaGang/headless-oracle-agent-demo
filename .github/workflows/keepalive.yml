name: keepalive

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump keepalive timestamp
        run: |
          date -u +"%Y-%m-%d" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive [skip ci]"
          git push
